# Runs the data script every morning and saves fresh data to the repository.
# GitHub Pages then serves the updated page automatically.
name: Update salt data

on:
  schedule:
    - cron: "37 13 * * *" # every day at 13:37 UTC (8:37 am Eastern in winter)
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Rebuild everything, including each stream's normal level"
        type: boolean
        default: false

permissions:
  contents: write # lets the workflow commit the new data file

concurrency:
  group: salt-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download USGS data and build data/salt.json
        env:
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }} # optional free USGS API key
        run: python scripts/fetch_salt.py ${{ inputs.full && '--full' || '' }}

      - name: Save the new data (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/salt.json
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Update salt data $(date -u +%Y-%m-%d)"
            git push
          fi
