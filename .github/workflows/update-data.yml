# Runs the data script every morning and saves fresh data to the repository.
# GitHub Pages then serves the updated page automatically.
name: Update salt data

on:
  schedule:
    - cron: "37 13 * * *" # every day at 13:37 UTC (8:37 am Eastern in winter)
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Rebuild everything, including each stream's normal level"
        type: boolean
        default: false
      season:
        description: "Optional: build a past winter instead, by its starting year (2024 = winter 2024-25)"
        type: string
        default: ""

permissions:
  contents: write # lets the workflow commit the new data files

concurrency:
  group: salt-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the first run after an upgrade also builds last winter's archive
    steps:
      - name: Get the repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download USGS data and build the data files
        env:
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }} # optional free USGS API key
          SEASON: ${{ inputs.season }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          if [ -n "$SEASON" ]; then
            case "$SEASON" in
              [12][0-9][0-9][0-9]) python scripts/fetch_salt.py --season "$SEASON" ;;
              *) echo "Season must be a starting year such as 2024"; exit 1 ;;
            esac
          else
            python scripts/fetch_salt.py $FULL
          fi

      - name: Look up watershed facts for new stations
        continue-on-error: true # never blocks the salt update
        run: python scripts/fetch_attributes.py

      - name: Save the new data (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Update salt data $(date -u +%Y-%m-%d)"
            git push
          fi
